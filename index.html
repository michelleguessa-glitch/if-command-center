  .check-row{display:flex;align-items:flex-start;gap:12px}
.check-row>details.note-card{flex:1;min-width:0}
.task-checkbox{flex:none;width:26px;height:26px;margin:18px 0 0;accent-color:var(--accent);cursor:pointer}
.check-row.is-done>details.note-card{opacity:.5}
.check-row.is-done summary h3{text-decoration:line-through}
.email-report{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.email-report h4{margin:0 0 10px;font-family:Georgia,serif;font-size:17px;font-weight:400}
.email-report .email-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.email-report input[type=email]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-alt);color:var(--text);font-size:15px}
.email-report input[type=email]::placeholder{color:var(--dim)}
.send-status{margin:10px 0 0;font-size:13px;color:var(--dim)}

.csv-upload{display:grid;gap:10px;padding:16px 2px;border-bottom:1px solid var(--line)}
.csv-buttons{display:flex;gap:22px;flex-wrap:wrap}
.csv-note{margin:0;color:var(--dim);font-size:12px}
.csv-preview{display:grid;gap:12px;padding:16px 2px;border-bottom:1px solid var(--line)}
.csv-preview h4{margin:0;font-size:14px}
.csv-rows{display:grid;gap:10px;max-height:340px;overflow:auto}
.csv-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.csv-row input[type=checkbox]{width:18px;height:18px}
.csv-row>span{display:grid;min-width:0}
.csv-date{color:var(--dim);font-size:11px}
.csv-payee{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csv-row strong{font-size:13px;white-space:nowrap}
.csv-row select{grid-column:1/-1;padding:9px 10px;border:1px solid #6d3b42;border-radius:8px;background:#0c0909;color:var(--text);font-size:13px}
.csv-actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.csv-status{margin:0;padding:12px 2px;color:var(--text);font-size:13px}
.receipt-zoom{padding:0;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;justify-self:start;max-width:120px}
.receipt-zoom img{display:block;width:100%;border-radius:9px}
.receipt-zoom.zoomed{max-width:none;width:100%}
.receipt-form{display:grid;gap:10px}
.receipt-form label{display:grid;gap:5px;font-size:12px;color:var(--dim);font-weight:700}
.receipt-form input,.receipt-form select{padding:11px 12px;border:1px solid #6d3b42;border-radius:8px;background:#0c0909;color:var(--text);font-size:14px;font-weight:400}
.link-danger{padding:0;border:0;background:transparent;color:#e08a8a;font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
.expense-remove{padding-top:8px}

const day=v=>{if(!v)return'';const d=new Date(v.length===10?v+'T12:00:00':v);return isNaN(d)?esc(v):new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(d)};

function glanceEventCard(x,idPrefix='overview',category='Calendar'){const p=zonedDateParts(x.startAt,x.timezone),range=x.timeLabel||(x.endTimezone?compact([timeOne(x.startAt,x.allDay,x.timezone),timeOne(x.endAt,x.allDay,x.endTimezone)]).replace(' · ',' – '):timeRange(x.startAt,x.endAt,x.allDay,x.timezone)),key=x.id??x._recordId??x.title;return `<details class="overview-event" id="${esc(idPrefix)}-${esc(key)}"><summary><div class="date"><span>${esc(p.m)}</span><strong>${esc(p.d)}</strong></div><div class="row-copy"><div class="meta"><span class="tag">${esc(category)}</span><span class="expand">View details</span></div><h3>${esc(x.title)}</h3>${range?`<p class="time">${esc(range)}</p>`:''}${x.location?`<p>${richText(x.location)}</p>`:''}</div></summary><div class="detail"><dl>${pair('Starts',x.startAt?moment(x.startAt,x.allDay,x.timezone):null)}${pair('Ends',x.endAt?moment(x.endAt,x.allDay,x.endTimezone||x.timezone):null)}${pair('Schedule',x.allDay?'All day':'Timed event')}${pair('Calendar',x.owner)}${pair('Time zone',x.endTimezone?`${x.timezone} → ${x.endTimezone}`:x.timezone)}${pair('Location',x.location)}</dl>${x.details?`<div class="notes"><strong>Details</strong><p>${richText(x.details)}</p></div>`:''}</div></details>`}

function renderOverview(){const upcoming=DATA.calendar.filter(x=>!calendarPast(x)).sort((a,b)=>a.startAt.localeCompare(b.startAt)).slice(0,4),bookingCount=DATA.bookings.filter(x=>x.kind!=='podcast').length,podcasts=podcastRows().length,openTasks=DATA.dailyTasks.filter(x=>!taskDone(x)).length,openPlan=DATA.rollout.filter(x=>x.status!=='done').length;return `<section class="view${activeTab==='overview'?' active':''}" data-view="overview"><div class="section-head overview-head"><div><p class="kicker">Operations at a glance</p><h2>${upcoming.length?'Next up':'Ready for the first update'}</h2><p>${upcoming.length?'Four nearest upcoming calendar events.':'The next scheduled item will appear here.'}</p></div></div><div class="overview-events">${upcoming.length?upcoming.map(overviewEventCard).join(''):'<p class="empty">Nothing here yet.</p>'}</div><div class="snapshot" aria-label="Command center snapshots"><button class="wide" data-go="revenue"><strong>${money(DATA.revenueSummary.received)}</strong><span>Revenue received</span><small><span>${DATA.revenueSummary.year}</span><b>OPEN →</b></small></button><button data-go="bookings"><strong>${bookingCount}</strong><span>Non-podcast bookings</span><small><span>OPEN</span><b>→</b></small></button><button data-go="podcasts"><strong>${podcasts}</strong><span>Podcast schedule items</span><small><span>OPEN</span><b>→</b></small></button><button data-go="travel"><strong>${DATA.travel.length}</strong><span>Travel</span><small><span>OPEN</span><b>→</b></small></button><button data-go="contacts"><strong>${DATA.contacts.length}</strong><span>Contacts</span><small><span>OPEN</span><b>→</b></small></button><button data-go="tasks"><strong>${openTasks}</strong><span>Open tasks</span><small><span>OPEN</span><b>→</b></small></button><button data-go="notes"><strong>${DATA.notes.length}</strong><span>Correspondence notes</span><small><span>OPEN</span><b>→</b></small></button><button data-go="rollout"><strong>${openPlan}</strong><span>Open plan ta function renderBookings(){const all=DATA.bookings.filter(x=>x.kind!=='podcast'),byDate=(a,b)=>(a.startDate||'9999').localeCompare(b.startDate||'9999')||a.title.localeCompare(b.title),past=all.filter(x=>x.status==='completed'||x.status==='cancelled'||bookingPast(x)).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')||a.title.localeCompare(b.title)),leads=all.filter(x=>!past.includes(x)&&x.status==='lead').sort(byDate),pending=all.filter(x=>!past.includes(x)&&!leads.includes(x)&&(x.status==='pending'||x.status==='tentative')).sort(byDate),upcoming=all.filter(x=>!past.includes(x)&&!leads.includes(x)&&!pending.includes(x)).sort(byDate);const body=all.length?`<div class="periods">${collapsible('Upcoming',upcoming.length,upcoming.map(bookingRow).join(''),true)}${collapsible('Pending',pending.length,pending.map(bookingRow).join(''))}${collapsible('Leads',leads.length,leads.map(bookingRow).join(''))}${collapsible('Past',past.length,past.map(bookingRow).join(''))}</div>`:'<div class="empty"><h3>No bookings yet</h3></div>';return viewShell('bookings','Bookings',all.length,body)}
function renderCalendar(){const shown=DATA.calendar.filter(x=>calendarFilter==='both'||x.owner==='Emanuel'),up=shown.filter(x=>!calendarPast(x)).sort((a,b)=>a.startAt.localeCompare(b.startAt)),past=shown.filter(calendarPast).sort((a,b)=>b.startAt.localeCompare(a.startAt));const filters=`<div class="filters two"><button data-calendar-filter="Emanuel" class="${calendarFilter==='Emanuel'?'selected':''}">Emanuel only</button><button data-calendar-filter="both" class="${calendarFilter==='both'?'selected':''}">Emanuel + Bri</button></div>`,group=(title,items)=>`<section><div class="period-head"><h3>${esc(title)}</h3><small class="count">${items.length}</small></div>${items.length?items.map(calendarRow).join(''):`<p class="empty">Nothing here yet.</p>`}</section>`;return viewShell('calendar','Calendar',shown.length,filters+`<div class="calendar-periods">${group('Upcoming',up)}${group('Past',past)}</div>`)}
function inferMedia(x){const explicit=x.contactType||x.mediaType;if(explicit==='pr_firm')return['pr_firm'];const text=compact([x.name,x.organization,x.role,x.notes]).toLowerCase(),s=new Set(explicit?[explicit]:[]);if(text.includes('creative director'))s.add('creative_director');if(text.includes('public relation')||/\bpr\b/.test(text))s.add('pr');if(text.includes('videograph')||/\bphoto\s*[\/&+]\s*video\b/.test(text))s.add('videographer');if(text.includes('photograph')||/\bphoto\s*[\/&+]\s*video\b/.test(text))s.add('photographer');if(text.includes('graphic'))s.add('graphic_designer');if(/web.{0,8}design/.test(text))s.add('web_designer');if(text.includes('radio'))s.add('radio');if(text.includes('podcast'))s.add('podcast');return[...s]}

// CSV import engine for IF Command Center expense entries (pure functions, node-testable)
function parseCSV(text){
  const rows=[];let row=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else q=false}
      else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(field);field=''}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field=''}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v||'').trim()!==''));
}
function detectColumns(rows){
  const head=rows[0].map(h=>String(h||'').trim().toLowerCase());
  const looksHeader=head.some(h=>/date|description|amount|debit|credit|memo|narrative|details|payee/.test(h));
  const cols={date:0,desc:1,amount:2,debit:-1,credit:-1,header:looksHeader};
  if(looksHeader){
    cols.date=-1;cols.desc=-1;cols.amount=-1;
    head.forEach((h,i)=>{
      if(/post/.test(h))return;
      if(cols.date<0&&/date/.test(h))cols.date=i;
      else if(cols.desc<0&&/(description|desc|memo|narrative|details|detail|payee|merchant|name)/.test(h))cols.desc=i;
      else if(cols.debit<0&&/(debit|withdrawal|paid.?out|money.?out)/.test(h))cols.debit=i;
      else if(cols.credit<0&&/(credit(?!.*card)|deposit|paid.?in|money.?in)/.test(h))cols.credit=i;
      else if(cols.amount<0&&/amount/.test(h))cols.amount=i;
    });
    if(cols.date<0)cols.date=0;
    if(cols.desc<0)cols.desc=1;
    if(cols.amount<0&&cols.debit<0)cols.amount=2;
  }
  return cols;
}
function parseAmt(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-+$/.test(s)){neg=true;s=s.replace(/-+$/,'')}
  s=s.replace(/[$,\s]/g,'');
  if(!/^[-+]?\d*\.?\d+$/.test(s))return null;
  const v=parseFloat(s);
  if(!isFinite(v))return null;
  return neg?-Math.abs(v):v;
}
function normDate(s){
  s=String(s==null?'':s).trim();if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')}
  return '';
}
function csvToCandidates(rows,cols){
  const out=[];
  const data=cols.header?rows.slice(1):rows;
  data.forEach(r=>{
    const date=normDate(r[cols.date]);
    const payee=String(r[cols.desc]==null?'':r[cols.desc]).trim().replace(/\s+/g,' ');
    let amt=null;
    if(cols.debit>=0||cols.credit>=0){
      const d=cols.debit>=0?parseAmt(r[cols.debit]):null;
      const c=cols.credit>=0?parseAmt(r[cols.credit]):null;
      if(d)amt=-Math.abs(d);else if(c)amt=Math.abs(c);
    }else if(cols.amount>=0){amt=parseAmt(r[cols.amount])}
    if(!date||!payee||amt===null||amt===0)return;
    if(amt>0)return;
    out.push({date:date,payee:payee,category:'Uncategorized',amount:Math.abs(amt)});
  });
  return out;
}
function parseReceiptText(text){
  text=String(text||'');
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  let date='';
  const dm=text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(dm)date=normDate(dm[0]);
  const amtRe=/\$?\s*(\d{1,3}(?:,\d{3})*\.\d{2})/g;
  const amountsOn=s=>{const out=[];let m;amtRe.lastIndex=0;const re=new RegExp(amtRe.source,'g');while((m=re.exec(s))){const v=parseFloat(m[1].replace(/,/g,''));if(v>0)out.push(v)}return out};
  let total=null;
  lines.forEach(l=>{
    if(/totals?|amount due|balance due|grand total|amount charged/i.test(l)){
      amountsOn(l).forEach(v=>{if(total===null||v>total)total=v});
    }
  });
  let amount=total;
  if(amount===null){
    let mx=null;
    amountsOn(text).forEach(v=>{if(mx===null||v>mx)mx=v});
    amount=mx;
  }
  let payee='';
  for(const l of lines){
    if(/[a-zA-Z]{3,}/.test(l)&&!/^\$?[\d,.\s\/\-:]+$/.test(l)){payee=l.replace(/\s+/g,' ').slice(0,60);break}
  }
  return {date:date,payee:payee,amount:amount};
}

let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res();s.onerror=()=>rej(new Error('scan library failed to load'));
    document.head.appendChild(s);
  });
  return tessLoading;
}
function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1000;let w=img.width||max,h=img.height||max;
        const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg',0.72));
      }catch(e){rej(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};
    img.src=url;
  });
}

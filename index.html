  const looksHeader=head.some(h=>/date|description|amount|debit|credit|memo|narrative|details|payee/.test(h));
  const cols={date:0,desc:1,amount:2,debit:-1,credit:-1,header:looksHeader};
  if(looksHeader){
    cols.date=-1;cols.desc=-1;cols.amount=-1;
    head.forEach((h,i)=>{
      if(/post/.test(h))return;
      if(cols.date<0&&/date/.test(h))cols.date=i;
      else if(cols.desc<0&&/(description|desc|memo|narrative|details|detail|payee|merchant|name)/.test(h))cols.desc=i;
      else if(cols.debit<0&&/(debit|withdrawal|paid.?out|money.?out)/.test(h))cols.debit=i;
      else if(cols.credit<0&&/(credit(?!.*card)|deposit|paid.?in|money.?in)/.test(h))cols.credit=i;
      else if(cols.amount<0&&/amount/.test(h))cols.amount=i;
    });
    if(cols.date<0)cols.date=0;
    if(cols.desc<0)cols.desc=1;
    if(cols.amount<0&&cols.debit<0)cols.amount=2;
  }
  return cols;
}
function parseAmt(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-+$/.test(s)){neg=true;s=s.replace(/-+$/,'')}
  s=s.replace(/[$,\s]/g,'');
  if(!/^[-+]?\d*\.?\d+$/.test(s))return null;
  const v=parseFloat(s);
  if(!isFinite(v))return null;
  return neg?-Math.abs(v):v;
}
function normDate(s){
  s=String(s==null?'':s).trim();if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')}
  return '';
}
function csvToCandidates(rows,cols){
  const out=[];
  const data=cols.header?rows.slice(1):rows;
  data.forEach(r=>{
    const date=normDate(r[cols.date]);
    const payee=String(r[cols.desc]==null?'':r[cols.desc]).trim().replace(/\s+/g,' ');
    let amt=null;
    if(cols.debit>=0||cols.credit>=0){
      const d=cols.debit>=0?parseAmt(r[cols.debit]):null;
      const c=cols.credit>=0?parseAmt(r[cols.credit]):null;
      if(d)amt=-Math.abs(d);else if(c)amt=Math.abs(c);
    }else if(cols.amount>=0){amt=parseAmt(r[cols.amount])}
    if(!date||!payee||amt===null||amt===0)return;
    if(amt>0)return;
    out.push({date:date,payee:payee,category:'Uncategorized',amount:Math.abs(amt)});
  });
  return out;
}
function parseReceiptText(text){
  text=String(text||'');
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  let date='';
  const dm=text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(dm)date=normDate(dm[0]);
  const amtRe=/\$?\s*(\d{1,3}(?:,\d{3})*\.\d{2})/g;
  const amountsOn=s=>{const out=[];let m;amtRe.lastIndex=0;const re=new RegExp(amtRe.source,'g');while((m=re.exec(s))){const v=parseFloat(m[1].replace(/,/g,''));if(v>0)out.push(v)}return out};
  let total=null;
  lines.forEach(l=>{
    if(/totals?|amount due|balance due|grand total|amount charged/i.test(l)){
      amountsOn(l).forEach(v=>{if(total===null||v>total)total=v});
    }
  });
  let amount=total;
  if(amount===null){
    let mx=null;
    amountsOn(text).forEach(v=>{if(mx===null||v>mx)mx=v});
    amount=mx;
  }
  let payee='';
  for(const l of lines){
    if(/[a-zA-Z]{3,}/.test(l)&&!/^\$?[\d,.\s\/\-:]+$/.test(l)){payee=l.replace(/\s+/g,' ').slice(0,60);break}
  }
  return {date:date,payee:payee,amount:amount};
}

function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1000;let w=img.width||max,h=img.height||max;
        const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);

        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg',0.72));
      }catch(e){rej(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};
    img.src=url;
  });
}

function checkStartingSoon(){
  try{
    const bar=document.getElementById('starting-soon-banner');
    if(!bar)return;
    let soon=[];
    if(typeof DATA!=='undefined'&&DATA&&DATA.calendar){
      const now=Date.now();
      soon=DATA.calendar.filter(e=>{
        if(!e||!e.startAt||e.startAt.indexOf('T')<0)return false;
        const t=new Date(e.startAt).getTime();
        if(isNaN(t))return false;
        const mins=(t-now)/60000;
        return mins>=-5&&mins<=60;
      }).sort((a,b)=>new Date(a.startAt)-new Date(b.startAt));
    }
    if(!soon.length){bar.hidden=true;bar.innerHTML='';return;}
    const now=Date.now();
    bar.innerHTML='<strong>Starting soon today</strong>'+soon.map(e=>{
      const t=new Date(e.startAt),mins=Math.round((t-now)/60000);
      const when=t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      const label=mins<=1?'starting now':('starts in '+mins+' min');
      const loc=e.location?(' \u2014 '+esc(e.location)):'';
      return '<div><span>'+esc(e.title||'Event')+'</span> \u00b7 '+esc(when)+' ('+label+')'+loc+'</div>';
    }).join('');
    bar.hidden=false;
  }catch(err){/* banner must never break the page */}
}

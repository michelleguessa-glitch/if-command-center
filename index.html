let startingSoonTimer=null;
function checkStartingSoon(){
  try{
    const bar=document.getElementById('starting-soon-banner');
    if(!bar)return;
    let soon=[];
    if(typeof DATA!=='undefined'&&DATA&&DATA.calendar){
      const now=Date.now();
      soon=DATA.calendar.filter(e=>{
        if(!e||!e.startAt||e.startAt.indexOf('T')<0)return false;
        const t=new Date(e.startAt).getTime();
        if(isNaN(t))return false;
        const mins=(t-now)/60000;
        return mins>=-5&&mins<=60;
      }).sort((a,b)=>new Date(a.startAt)-new Date(b.startAt));
    }
    if(!soon.length){bar.hidden=true;bar.innerHTML='';return;}
    const now=Date.now();
    bar.innerHTML='<strong>Starting soon today</strong>'+soon.map(e=>{
      const t=new Date(e.startAt),mins=Math.round((t-now)/60000);
      const when=t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZone:e.timezone||'America/Chicago',timeZoneName:'short'});
      const label=mins<=1?'starting now':('starts in '+mins+' min');
      const loc=e.location?(' \u2014 '+esc(e.location)):'';
      return '<div><span>'+esc(e.title||'Event')+'</span> \u00b7 '+esc(when)+' ('+label+')'+loc+'</div>';
    }).join('');
    bar.hidden=false;
  }catch(err){/* banner must never break the page */}
}
function armStartingSoon(){checkStartingSoon();if(!startingSoonTimer)startingSoonTimer=setInterval(checkStartingSoon,60000);}

<script>
(function(){
  var viewer=null,bodyEl=null,titleEl=null,prevOverflow='';
  function ensure(){
    if(viewer)return;
    viewer=document.createElement('div');viewer.id='ifcc-doc-viewer';

    titleEl=viewer.querySelector('.dv-title');bodyEl=viewer.querySelector('.dv-body');

  }
  function open(url,label){
    ensure();
    titleEl.textContent=label||'Document';
    bodyEl.innerHTML='';
    if(/\.pdf($|\?)/i.test(url)){
      var f=document.createElement('iframe');f.src=url;f.title=label||'Document';bodyEl.appendChild(f);
